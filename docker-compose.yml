services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10
  mnemo:
    build: .
    ports: ["8000:8000"]
    env_file: [{ path: .env, required: false }]
    environment:
      MONGODB_URI: mongodb://mongo:27017
      STORE_BACKEND: mongo
    depends_on:
      mongo: { condition: service_healthy }
volumes:
  mongo-data:
