[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo"
version = "1.0.0"
description = "MNEMO: reinforcement learning for temporally consistent, budget-constrained memory management in LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abiraminayagi Subbarathanam" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "pymongo>=4.6",
  "gymnasium>=0.29",
]

[project.optional-dependencies]
rl = [
  "torch>=2.2",
  "stable-baselines3>=2.3",
  "sb3-contrib>=2.3",
  "matplotlib>=3.8",
]
service = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "mongomock>=4.1",
  "ruff>=0.4",
]
all = ["mnemo[rl,service,dev]"]

[project.scripts]
mnemo = "mnemo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "mongo: requires a live MongoDB (set MONGODB_URI to run)",
  "slow: slower end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning"]
